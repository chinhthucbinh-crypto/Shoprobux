<title>Bạn Hiểu Bình Cỡ Nào</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap&subset=vietnamese" rel="stylesheet">
<style>
/* Layout: một màn hình dọc, mây trôi phía sau, nhân vật ở giữa, thẻ câu hỏi nằm trên cùng. */
:root {
  --sky-top: #8fd3ff;
  --sky-bottom: #e4f6ff;
  --cloud: #ffffff;
  --ink: #2b3a67;
  --pink: #ff8fab;
  --butter: #ffe08a;
  --good: #3fbf8a;
  --bad: #f2788c;
  --card: rgba(255,255,255,.92);
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  overflow-x: hidden;
}
* { box-sizing: border-box; }

.sky { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
.cloud {
  position: absolute; left: -30%;
  width: var(--w); height: calc(var(--w) * .38);
  background: var(--cloud);
  border-radius: 999px;
  opacity: .9;
  animation: drift var(--t) linear infinite;
  animation-delay: var(--d);
}
.cloud::before, .cloud::after {
  content: ""; position: absolute; background: var(--cloud); border-radius: 50%;
}
.cloud::before { width: 46%; height: 120%; left: 14%; top: -55%; }
.cloud::after { width: 34%; height: 95%; left: 50%; top: -35%; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(160vw); } }

.app {
  position: relative; z-index: 1;
  min-height: 100%;
  max-width: 480px; margin: 0 auto;
  padding-inline: 20px; padding-block: 28px 36px;
  display: flex; flex-direction: column; align-items: center; gap: 18px;
}
.screen { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 18px; }

h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; text-align: center; line-height: 1.1; }
h1 { font-size: clamp(2.2rem, 9vw, 2.9rem); font-weight: 800; }
h2 { font-size: clamp(1.5rem, 6vw, 1.9rem); font-weight: 700; }
p { margin: 0; text-align: center; line-height: 1.45; }

.card {
  width: 100%;
  background: var(--card);
  border-radius: 28px;
  padding: 22px 20px;
  box-shadow: 0 10px 0 rgba(43,58,103,.12);
  display: flex; flex-direction: column; gap: 14px;
}

.pet { width: min(62vw, 240px); height: auto; overflow: visible; }
.pet .bob { animation: bob 3s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

label.field { font-weight: 800; font-size: .95rem; }
input[type=text] {
  width: 100%; font: inherit; font-weight: 700; color: var(--ink);
  background: #fff; border: 3px solid var(--ink); border-radius: 18px;
  padding: 14px 16px; outline: none;
}
input[type=text]:focus-visible { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(255,143,171,.35); }

.btn {
  font-family: var(--font-display); font-weight: 700; font-size: 1.2rem;
  color: var(--ink); background: var(--butter);
  border: 3px solid var(--ink); border-radius: 999px;
  padding: 12px 26px; cursor: pointer;
  box-shadow: 0 5px 0 var(--ink);
  transition: transform .08s, box-shadow .08s;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn:focus-visible, .opt:focus-visible { outline: 4px solid var(--pink); outline-offset: 3px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.progress { display: flex; gap: 8px; }
.dot { width: 34px; height: 10px; border-radius: 99px; background: rgba(43,58,103,.2); }
.dot.on { background: var(--pink); }
.dot.done { background: var(--good); }

.q { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; line-height: 1.25; text-align: center; text-wrap: balance; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opt {
  font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1.2;
  color: var(--ink); background: #fff;
  border: 3px solid var(--ink); border-radius: 20px;
  padding: 16px 10px; min-height: 76px; cursor: pointer;
  box-shadow: 0 5px 0 var(--ink);
  transition: transform .08s, box-shadow .08s, background .15s;
}
.opt:hover:not([disabled]) { background: #fff6d6; }
.opt:active:not([disabled]) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.opt[disabled] { cursor: default; }
.opt.right { background: #c9f2df; border-color: var(--good); box-shadow: 0 5px 0 var(--good); }
.opt.wrong { background: #ffd9e0; border-color: var(--bad); box-shadow: 0 5px 0 var(--bad); }
.opt.faded { opacity: .55; }

.feedback { min-height: 3.2em; font-weight: 800; }
.feedback.good { color: #1f8a5f; }
.feedback.bad { color: #c24560; }

.score { font-family: var(--font-display); font-weight: 800; font-size: 3.4rem; line-height: 1; }
.hearts { display: flex; gap: 10px; justify-content: center; }
.hearts svg { width: 38px; height: 38px; }

@media (prefers-reduced-motion: reduce) {
  .cloud, .pet .bob { animation: none; }
  .cloud { left: 10%; }
}
</style>

<div class="sky" aria-hidden="true">
  <div class="cloud" style="--w:180px; --t:55s; --d:-10s; top:6%"></div>
  <div class="cloud" style="--w:120px; --t:70s; --d:-40s; top:22%"></div>
  <div class="cloud" style="--w:220px; --t:62s; --d:-28s; top:58%"></div>
  <div class="cloud" style="--w:140px; --t:80s; --d:-5s; top:78%"></div>
  <div class="cloud" style="--w:100px; --t:48s; --d:-22s; top:42%"></div>
</div>

<main class="app">

  <!-- Nhân vật dùng chung cho mọi màn hình -->
  <svg class="pet" viewBox="0 0 240 220" role="img" aria-label="Nhân vật dễ thương của Bình">
    <g class="bob">
      <ellipse cx="120" cy="206" rx="62" ry="8" fill="#2b3a67" opacity=".12"/>
      <path d="M62 78 L52 28 Q50 20 58 24 L96 52 Z" fill="#ffc2d1" stroke="#2b3a67" stroke-width="5" stroke-linejoin="round"/>
      <path d="M178 78 L188 28 Q190 20 182 24 L144 52 Z" fill="#ffc2d1" stroke="#2b3a67" stroke-width="5" stroke-linejoin="round"/>
      <ellipse cx="120" cy="128" rx="88" ry="72" fill="#ffe3ea" stroke="#2b3a67" stroke-width="5"/>
      <ellipse cx="62" cy="150" rx="15" ry="10" fill="#ff8fab" opacity=".75"/>
      <ellipse cx="178" cy="150" rx="15" ry="10" fill="#ff8fab" opacity=".75"/>

      <!-- mắt -->
      <g id="eyes-normal">
        <circle cx="86" cy="124" r="9" fill="#2b3a67"/><circle cx="154" cy="124" r="9" fill="#2b3a67"/>
        <circle cx="89" cy="120" r="3" fill="#fff"/><circle cx="157" cy="120" r="3" fill="#fff"/>
      </g>
      <g id="eyes-happy" hidden>
        <path d="M74 128 Q86 110 98 128" fill="none" stroke="#2b3a67" stroke-width="6" stroke-linecap="round"/>
        <path d="M142 128 Q154 110 166 128" fill="none" stroke="#2b3a67" stroke-width="6" stroke-linecap="round"/>
      </g>
      <g id="eyes-sad" hidden>
        <circle cx="86" cy="128" r="9" fill="#2b3a67"/><circle cx="154" cy="128" r="9" fill="#2b3a67"/>
        <circle cx="89" cy="124" r="3" fill="#fff"/><circle cx="157" cy="124" r="3" fill="#fff"/>
        <path d="M72 108 L98 114" stroke="#2b3a67" stroke-width="5" stroke-linecap="round"/>
        <path d="M168 108 L142 114" stroke="#2b3a67" stroke-width="5" stroke-linecap="round"/>
      </g>
      <g id="eyes-sleepy" hidden>
        <path d="M74 126 L98 126" stroke="#2b3a67" stroke-width="6" stroke-linecap="round"/>
        <path d="M142 126 L166 126" stroke="#2b3a67" stroke-width="6" stroke-linecap="round"/>
      </g>

      <!-- miệng -->
      <path id="mouth-smile" d="M108 146 Q120 158 132 146" fill="none" stroke="#2b3a67" stroke-width="5" stroke-linecap="round"/>
      <path id="mouth-open" hidden d="M104 144 Q120 172 136 144 Z" fill="#ff6f91" stroke="#2b3a67" stroke-width="5" stroke-linejoin="round"/>
      <path id="mouth-sad" hidden d="M108 156 Q120 144 132 156" fill="none" stroke="#2b3a67" stroke-width="5" stroke-linecap="round"/>
    </g>
  </svg>

  <!-- 1. Màn hình bắt đầu -->
  <section class="screen" id="screen-start">
    <h1>Bạn hiểu Bình cỡ nào?</h1>
    <div class="card">
      <p>Chỉ có 3 câu thôi. Đoán đúng hết thì bạn là bạn thân của Bình.</p>
      <label class="field" for="name">Tên của bạn là gì?</label>
      <input type="text" id="name" maxlength="20" autocomplete="off" placeholder="Nhập tên của bạn">
      <button class="btn" id="btn-start" type="button" disabled>Bắt đầu</button>
    </div>
  </section>

  <!-- 2. Câu hỏi -->
  <section class="screen" id="screen-quiz" hidden>
    <div class="progress" id="progress" aria-hidden="true"></div>
    <div class="card">
      <div class="q" id="q-text"></div>
      <div class="opts" id="opts"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <button class="btn" id="btn-next" type="button" hidden>Câu tiếp</button>
    </div>
  </section>

  <!-- 3. Kết quả -->
  <section class="screen" id="screen-result" hidden>
    <div class="card">
      <h2 id="r-title"></h2>
      <div class="score" id="r-score" style="text-align:center"></div>
      <div class="hearts" id="r-hearts" aria-hidden="true"></div>
      <p id="r-msg"></p>
      <button class="btn" id="btn-again" type="button">Chơi lại</button>
    </div>
  </section>
</main>

<script>
(function () {
  var QUESTIONS = [
    {
      q: "Bình thích cái nào hơn?",
      options: ["Vẽ", "Bánh tráng"],
      answer: "Bánh tráng",
      good: "Đúng rồi! Bánh tráng là chân ái của Bình.",
      bad: "Sai rồi nha. Bình mê bánh tráng hơn cả vẽ."
    },
    {
      q: "Khi rảnh, Bình sẽ làm gì?",
      options: ["Vẽ", "Ngủ"],
      answer: "Vẽ",
      good: "Chuẩn luôn! Rảnh là Bình lôi giấy bút ra vẽ.",
      bad: "Chưa đúng. Rảnh là Bình vẽ chứ không ngủ."
    },
    {
      q: "Bạn gặp Bình trên lớp thì Bình đang ở trạng thái nào?",
      options: ["Ngủ", "Vừa thức vừa ngủ"],
      answer: "Vừa thức vừa ngủ",
      good: "Đúng! Mắt mở nhưng hồn còn đang ở trên mây.",
      bad: "Sai rồi. Bình trên lớp luôn là vừa thức vừa ngủ."
    }
  ];

  var RESULTS = [
    { t: "Hình như mình mới quen hả?", m: "Bạn chưa đoán trúng câu nào. Ngồi cạnh Bình thêm vài buổi nữa rồi chơi lại nhé." },
    { t: "Mới hiểu một xíu thôi", m: "Bạn trúng 1 câu. Bình thấy bạn có tiềm năng, cần quan sát kỹ hơn." },
    { t: "Gần thành bạn thân rồi", m: "Bạn trúng 2 câu. Chỉ thiếu một chút nữa là hiểu Bình trọn vẹn." },
    { t: "Bạn thân thiết của Bình!", m: "Trúng cả 3 câu. Bạn hiểu Bình đến từng chi tiết, kể cả cái vụ vừa thức vừa ngủ." }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var nameInput = $("name"), btnStart = $("btn-start"), btnNext = $("btn-next"), btnAgain = $("btn-again");
  var screens = { start: $("screen-start"), quiz: $("screen-quiz"), result: $("screen-result") };
  var player = "", idx = 0, score = 0, answered = false;

  function show(name) {
    Object.keys(screens).forEach(function (k) { screens[k].hidden = (k !== name); });
  }

  function setFace(eyes, mouth) {
    ["normal", "happy", "sad", "sleepy"].forEach(function (e) { $("eyes-" + e).hidden = (e !== eyes); });
    ["smile", "open", "sad"].forEach(function (m) { $("mouth-" + m).hidden = (m !== mouth); });
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function renderProgress() {
    var box = $("progress");
    box.innerHTML = "";
    QUESTIONS.forEach(function (_, i) {
      var d = document.createElement("div");
      d.className = "dot" + (i < idx ? " done" : i === idx ? " on" : "");
      box.appendChild(d);
    });
  }

  function renderQuestion() {
    var item = QUESTIONS[idx];
    answered = false;
    renderProgress();
    $("q-text").textContent = item.q;
    var fb = $("feedback");
    fb.textContent = "";
    fb.className = "feedback";
    btnNext.hidden = true;
    btnNext.textContent = idx === QUESTIONS.length - 1 ? "Xem kết quả" : "Câu tiếp";
    var box = $("opts");
    box.innerHTML = "";
    shuffle(item.options).forEach(function (label) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "opt";
      b.textContent = label;
      b.addEventListener("click", function () { choose(b, label); });
      box.appendChild(b);
    });
    setFace("normal", "smile");
  }

  function choose(btn, label) {
    if (answered) return;
    answered = true;
    var item = QUESTIONS[idx];
    var ok = label === item.answer;
    if (ok) score++;
    Array.prototype.forEach.call($("opts").children, function (b) {
      b.disabled = true;
      if (b.textContent === item.answer) b.classList.add("right");
      else if (b === btn) b.classList.add("wrong");
      else b.classList.add("faded");
    });
    var fb = $("feedback");
    fb.textContent = (ok ? item.good : item.bad);
    fb.classList.add(ok ? "good" : "bad");
    setFace(ok ? "happy" : "sad", ok ? "open" : "sad");
    btnNext.hidden = false;
    btnNext.focus({ preventScroll: true });
  }

  function heart(on) {
    var fill = on ? "#ff6f91" : "rgba(43,58,103,.15)";
    return '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3 5.5 6.2 5.5c2 0 3.3 1.1 3.8 2.2.5-1.1 1.8-2.2 3.8-2.2 3.2 0 5 3.1 3.7 6.3C19.5 16.4 12 21 12 21z" fill="' + fill + '" stroke="#2b3a67" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  }

  function showResult() {
    var r = RESULTS[score];
    $("r-title").textContent = player + ", " + r.t.charAt(0).toLowerCase() + r.t.slice(1);
    $("r-score").textContent = score + "/" + QUESTIONS.length;
    var h = "";
    for (var i = 0; i < QUESTIONS.length; i++) h += heart(i < score);
    $("r-hearts").innerHTML = h;
    $("r-msg").textContent = r.m;
    show("result");
    if (score === 3) setFace("happy", "open");
    else if (score === 0) setFace("sad", "sad");
    else setFace("sleepy", "smile");
  }

  function start() {
    var n = nameInput.value.trim();
    if (!n) return;
    player = n;
    idx = 0; score = 0;
    show("quiz");
    renderQuestion();
  }

  nameInput.addEventListener("input", function () { btnStart.disabled = !nameInput.value.trim(); });
  nameInput.addEventListener("keydown", function (e) { if (e.key === "Enter") start(); });
  btnStart.addEventListener("click", start);
  btnNext.addEventListener("click", function () {
    idx++;
    if (idx >= QUESTIONS.length) showResult();
    else renderQuestion();
  });
  btnAgain.addEventListener("click", function () {
    idx = 0; score = 0;
    show("quiz");
    renderQuestion();
  });

  setFace("sleepy", "smile");
  nameInput.addEventListener("focus", function () { setFace("normal", "smile"); });
})();
</script>
