<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANGGAMES Shop - Robux</title>
<style>
  :root{
    --bg:#050b1f;
    --panel:#0d1a3a;
    --line:#1c2f5c;
    --accent:#facc15;
    --blue:#2563eb;
    --text:#e5e7eb;
    --muted:#8ca0c9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    padding-bottom:40px;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    border-bottom:1px solid var(--line);
  }
  .logo{
    font-weight:800;
    font-size:20px;
    letter-spacing:0.5px;
  }
  .logo span{color:var(--blue);}
  .search{
    margin:16px 20px;
    display:flex;
    align-items:center;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
    color:var(--muted);
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding:0 20px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .15s ease, border-color .15s ease;
  }
  .card:active{transform:scale(0.97);}
  .card:hover{border-color:var(--accent);}
  .thumb{
    height:110px;
    background:
      radial-gradient(circle at 30% 30%, rgba(250,204,21,0.15), transparent 60%),
      repeating-linear-gradient(45deg, #1a2233 0 20px, #161d2c 20px 40px);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .robux-icon{
    width:52px;height:52px;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .robux-diamond{
    width:36px;height:36px;
    background:linear-gradient(135deg,#fff9e0 0%,var(--accent) 45%,#c98f0a 100%);
    transform:rotate(45deg);
    border-radius:8px;
    position:relative;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.35),
      0 3px 8px rgba(0,0,0,0.5),
      inset 0 1px 2px rgba(255,255,255,0.6),
      inset 0 -3px 4px rgba(120,75,0,0.5);
  }
  .robux-diamond::after{
    content:"";
    position:absolute;
    top:50%;left:50%;
    width:13px;height:13px;
    background:var(--bg);
    border-radius:4px;
    transform:translate(-50%,-50%);
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.8);
  }
  .robux-count{
    position:absolute;
    bottom:-6px;
    background:#000;
    color:var(--accent);
    font-size:11px;
    font-weight:800;
    padding:1px 7px;
    border-radius:8px;
    border:1px solid var(--accent);
    white-space:nowrap;
  }
  .info{padding:10px 12px;}
  .amount{font-size:15px;font-weight:700;color:var(--text);}
  .price{color:var(--blue);font-weight:700;margin-top:2px;}
  .footer-bar{
    position:sticky;
    bottom:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border-top:1px solid var(--line);
    padding:14px 20px;
    margin-top:20px;
  }
  .total-label{color:var(--muted);font-size:13px;}
  .total-value{color:var(--blue);font-weight:700;}
  .btn-continue{
    background:var(--blue);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:12px 22px;
    font-weight:700;
    cursor:pointer;
  }
  /* Modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--panel);
    width:100%;
    max-width:480px;
    border-radius:18px 18px 0 0;
    padding:28px 24px 26px;
    text-align:center;
    animation:up .2s ease;
    border-top:1px solid var(--line);
  }
  @keyframes up{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet-icon{
    width:56px;height:56px;
    margin:0 auto 14px;
    border-radius:50%;
    background:#1f2937;
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:26px;
  }
  .sheet h3{margin:0 0 8px;font-size:17px;}
  .sheet p{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.5;}
  .sheet button{
    width:100%;
    background:var(--blue);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:12px;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <div class="logo">ANG<span>GAMES</span> Shop</div>
  <div style="color:var(--muted);font-size:13px;">VN</div>
</header>

<div class="search">🔍&nbsp; Roblox ANG</div>

<div class="grid">
  <div class="card" onclick="showNotice()">
    <div class="thumb"><div class="robux-icon"><div class="robux-diamond"></div><span class="robux-count">55</span></div></div>
    <div class="info">
      <div class="amount">Gói 55 Robux</div>
      <div class="price">20.000 VND</div>
    </div>
  </div>

  <div class="card" onclick="showNotice()">
    <div class="thumb"><div class="robux-icon"><div class="robux-diamond"></div><span class="robux-count">145</span></div></div>
    <div class="info">
      <div class="amount">Gói 145 Robux</div>
      <div class="price">50.000 VND</div>
    </div>
  </div>

  <div class="card" onclick="showNotice()">
    <div class="thumb"><div class="robux-icon"><div class="robux-diamond"></div><span class="robux-count">300</span></div></div>
    <div class="info">
      <div class="amount">Gói 300 Robux</div>
      <div class="price">100.000 VND</div>
    </div>
  </div>

  <div class="card" onclick="showNotice()">
    <div class="thumb"><div class="robux-icon"><div class="robux-diamond"></div><span class="robux-count">700</span></div></div>
    <div class="info">
      <div class="amount">Gói 700 Robux</div>
      <div class="price">220.000 VND</div>
    </div>
  </div>
</div>

<div class="footer-bar">
  <div>
    <div class="total-label">Tổng tiền</div>
    <div class="total-value">0 VND</div>
  </div>
  <button class="btn-continue" onclick="showNotice()">Tiếp tục</button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-icon">🚧</div>
    <h3>Chức năng đang bảo trì</h3>
    <p>Hiện tại chưa phát hành. Vui lòng quay lại sau để tiếp tục mua Robux.</p>
    <button onclick="hideNotice()">Đã hiểu</button>
  </div>
</div>

<script>
function showNotice(){
  document.getElementById('overlay').classList.add('show');
}
function hideNotice(){
  document.getElementById('overlay').classList.remove('show');
}
</script>

</body>
</html>
